  <text x="128" y="360" font-family="Arial, sans-serif" font-size="22" fill="#1E40AF">signals for this spec and cite evidence.</text>
  <rect x="656" y="222" width="472" height="332" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
