  <text x="96" y="124" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">BuildBetter product-signal workflow</text>
  <text x="96" y="168" font-family="Arial, sans-serif" font-size="20" fill="#475569">Codex uses BuildBetter MCP to find customer evidence, cite stable IDs, and shape product work.</text>
  <rect x="96" y="222" width="496" height="332" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="128" y="276" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">Prompt</text>
